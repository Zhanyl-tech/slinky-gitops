# Slurm cluster values. Kept in git so the deployed shape is reviewable rather
# than living in someone's shell history as a string of --set flags.
nodesets:
  slinky:
    # One replica is enough on KinD; a real cluster scales this or adds
    # nodesets per hardware class (not built here; see README "Honest scope").
    # CI renders this file with the pinned chart and validates the result
    # against the Slinky CRDs (scripts/ci/validate-manifests.sh).
    replicas: 1

partitions:
  all:
    enabled: true
