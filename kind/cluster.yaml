# Three nodes so nodesets actually schedule across workers rather than
# co-locating on a single node and hiding placement bugs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: slinky
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
