<svg width="1200" height="730" viewBox="0 0 1200 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Rotating auth/slurm on Slinky: where the key stops propagating</title>
<desc id="dsc">The Kubernetes Secret holds the new key. slurmctld adopts it. slurmd is served a stale cached copy by the kubelet, so the controller-to-slurmd trust boundary breaks and the rotation is rolled back.</desc>

<rect width="1200" height="730" fill="#1a1520"/>

<rect width="1200" height="86" fill="#241c26"/>
<rect width="6" height="86" fill="#f5b544"/>
<text x="44" y="38" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e9eff5">Rotating auth/slurm on Slinky - where the key stops propagating</text>
<text x="44" y="66" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#828c98">Slurm 26.05 / Slinky operator v1.2 / measured on a clean KinD cluster</text>

<g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14.5">
