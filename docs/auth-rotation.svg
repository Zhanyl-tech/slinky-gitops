<animate attributeName="opacity" values="0;0;0.30;0.30;0;0" keyTimes="0;0.030;0.045;0.130;0.145;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="130" y="141" fill="#e9eff5" text-anchor="middle">1 Preflight</text>

<rect x="230" y="112" width="176" height="46" rx="8" fill="#251d28" stroke="#3fb950" stroke-width="1.5"/>
<rect x="230" y="112" width="176" height="46" rx="8" fill="#58a6ff" opacity="0">
<animate attributeName="opacity" values="0;0;0.30;0.30;0;0" keyTimes="0;0.185;0.200;0.285;0.300;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="318" y="141" fill="#e9eff5" text-anchor="middle">2 Plan</text>

<rect x="418" y="112" width="176" height="46" rx="8" fill="#251d28" stroke="#3fb950" stroke-width="1.5"/>
<rect x="418" y="112" width="176" height="46" rx="8" fill="#58a6ff" opacity="0">
<animate attributeName="opacity" values="0;0;0.30;0.30;0;0" keyTimes="0;0.340;0.355;0.440;0.455;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="506" y="141" fill="#e9eff5" text-anchor="middle">3 Drain</text>

<rect x="606" y="112" width="176" height="46" rx="8" fill="#251d28" stroke="#3fb950" stroke-width="1.5"/>
<rect x="606" y="112" width="176" height="46" rx="8" fill="#58a6ff" opacity="0">
<animate attributeName="opacity" values="0;0;0.30;0.30;0;0" keyTimes="0;0.495;0.510;0.595;0.610;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="694" y="141" fill="#e9eff5" text-anchor="middle">4 Back up</text>

<rect x="794" y="112" width="176" height="46" rx="8" fill="#251d28" stroke="#3fb950" stroke-width="1.5"/>
<rect x="794" y="112" width="176" height="46" rx="8" fill="#58a6ff" opacity="0">
<animate attributeName="opacity" values="0;0;0.30;0.30;0;0" keyTimes="0;0.650;0.665;0.750;0.765;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="882" y="141" fill="#e9eff5" text-anchor="middle">5 Rotate</text>

<rect x="982" y="112" width="176" height="46" rx="8" fill="#251d28" stroke="#f85149" stroke-width="1.5"/>
<rect x="982" y="112" width="176" height="46" rx="8" fill="#f85149" opacity="0">
<animate attributeName="opacity" values="0;0;0.32;0.32;0;0" keyTimes="0;0.805;0.820;0.905;0.920;1" dur="5s" repeatCount="indefinite"/>
</rect>
<text x="1060" y="141" fill="#e9eff5" text-anchor="middle">6 Verify</text>
<path d="M1130,134 L1142,146 M1142,134 L1130,146" stroke="#f85149" stroke-width="2.6" stroke-linecap="round" fill="none"/>
</g>

<rect x="50" y="292" width="252" height="152" rx="12" fill="#251d28" stroke="#3a3040" stroke-width="1.5"/>
<text x="70" y="320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11.5" letter-spacing="1.4" fill="#828c98" font-weight="700">KUBERNETES SECRET</text>
<text x="70" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16.5" font-weight="600" fill="#e9eff5">slurm-auth-slurm</text>
<text x="70" y="372" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#f5b544">immutable: true</text>
<line x1="70" y1="388" x2="282" y2="388" stroke="#3a3040" stroke-width="1"/>
<text x="70" y="410" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#828c98">slurm.key (new)</text>
<text x="70" y="431" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#3fb950">sha c5016281...</text>

