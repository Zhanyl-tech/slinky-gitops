name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The README promises `make up` works. Prove it on every push, against a real
  # KinD cluster, rather than trusting that it still does.
  bring-up:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          config: kind/cluster-ci.yaml
          cluster_name: slinky
      - name: Install operator
        run: make operator
      - name: Deploy Slurm
        run: make slurm
      - name: Run a job
        run: make job

      # On Slinky v1.2 the in-place rotation does not propagate: a slurmd pod
      # created after the Secret is replaced still mounts the previous key.
      # See README "What CI caught". Until that is solved, the property worth
      # testing is not that rotation succeeds — it is that a rotation which
      # cannot work refuses to report success, rolls back, and leaves a cluster
      # that still runs jobs. A silent green tick here is the actual hazard.
      - name: Rotation refuses to lie and rolls back
        run: |
          if make rotate; then
            echo "::error::make rotate reported success; propagation is known to fail on this version."
            echo "If this is now genuinely fixed, update the README and make this step expect success."
            exit 1
          fi
          echo "rotation failed and rolled back, as expected"

      - name: Cluster still runs a job after the rollback
        run: make job

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/*.sh
